name: CongressTrader — Earnings Bot

on:
  schedule:
    # 15:35 UTC = 11:35 ET (dentro del mercado USA todo el año)
    - cron: '35 15 * * 1-5'
  workflow_dispatch:  # permite lanzarlo manualmente desde GitHub

permissions:
  contents: write  # necesario para hacer commit de position_entries.json

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ALPACA_KEY:      ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET:   ${{ secrets.ALPACA_SECRET }}
          RESEND_API_KEY:  ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO:        ${{ secrets.EMAIL_TO }}
        run: python main.py

      - name: Guardar estado (position_entries, cache, csv)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add position_entries.json sectors_cache.json results_earnings.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "bot: actualizar estado [skip ci]"
          git push
