name: CongressTrader — Earnings Bot

on:
  schedule:
    # 15:35 UTC = 11:35 ET (dentro del mercado USA todo el año)
    - cron: '35 15 * * 1-5'
  workflow_dispatch:  # permite lanzarlo manualmente desde GitHub

permissions:
  contents: write  # necesario para hacer commit de position_entries.json

concurrency:       # nunca a la vez que el modulo largo/corto: los dos hacen push al mismo repo
  group: bot-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ALPACA_KEY:      ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET:   ${{ secrets.ALPACA_SECRET }}
          RESEND_API_KEY:  ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO:        ${{ secrets.EMAIL_TO }}
        run: python main.py

      # El modulo largo/corto corre aparte, de noche: ver run_ls.yml

      - name: Guardar estado (position_entries, cache, csv; aunque el bot falle)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in position_entries.json sectors_cache.json results_earnings.csv results.csv trade_meta.json closed_trades.csv; do
            [ -f "$f" ] && git add "$f"
          done || true
          git diff --staged --quiet && exit 0
          git commit -m "bot: actualizar estado [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 10
          done
          exit 1
